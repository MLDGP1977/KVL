<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVL - Seleção de Painel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Cabeçalho com logos */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-bottom: 18px;
        }
        .logo-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 16px rgba(0,0,0,.08);
            border: 1px solid #e5e7eb;
        }
        .logos img {
            height: 52px;
            width: auto;
            object-fit: contain;
        }
        .divider {
            width: 2px;
            height: 40px;
            background: #d1d5db;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: .5px;
            margin-bottom: 6px;
            color: #111827;
        }
        p.sub {
            color: #6b7280;
            font-size: 1rem;
        }

        /* Grid das seções */
        .section {
            width: 100%;
            max-width: 960px;
            margin-bottom: 28px;
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6b7280;
            margin-bottom: 14px;
        }
        .section-title .bar {
            width: 4px;
            height: 18px;
            border-radius: 2px;
        }
        .bar-kvl { background: #0284c7; }
        .bar-blessed { background: #d97706; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        /* Cards brancos estilo Power BI */
        .card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 26px;
            text-decoration: none;
            color: #1f2937;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }
        .card.kvl::before { background: linear-gradient(90deg, #38bdf8, #0284c7); }
        .card.blessed::before { background: linear-gradient(90deg, #fbbf24, #d97706); }
        .card:hover {
            transform: translateY(-6px);
            border-color: #38bdf8;
            box-shadow: 0 12px 28px rgba(2, 132, 199, .15);
        }
        .card.blessed:hover {
            border-color: #f59e0b;
            box-shadow: 0 12px 28px rgba(217, 119, 6, .15);
        }
        .card-content {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .card img {
            height: 54px;
            width: auto;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
            padding: 8px;
            border: 1px solid #f3f4f6;
        }
        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #111827;
        }
        .card p {
            color: #6b7280;
            font-size: .9rem;
        }
        .card .arrow {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            color: #9ca3af;
            transition: color .2s, transform .2s;
        }
        .card:hover .arrow {
            color: #0284c7;
            transform: translateY(-50%) translateX(4px);
        }
        .card.blessed:hover .arrow { color: #d97706; }

        /* Responsivo */
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .logos { flex-direction: column; gap: 12px; }
            .divider { width: 60px; height: 2px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logos">
            <div class="logo-box"><img src="logo.png" alt="Logo KVL"></div>
            <div class="divider"></div>
            <div class="logo-box"><img src="logoB2.png" alt="Logo Blessed"></div>
        </div>
        <h1>Painéis de Produção</h1>
        <p class="sub">Selecione o painel que deseja acessar</p>
    </div>

    <!-- Seção KVL -->
    <div class="section">
        <div class="section-title">
            <span class="bar bar-kvl"></span>
            KVL
        </div>
        <div class="grid">
            <a class="card kvl" href="KVL/index.html">
                <div class="card-content">
                    <img src="logo.png" alt="Logo KVL">
                    <div>
                        <h2>KVL OP</h2>
                        <p>Painel principal de produção</p>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
            <a class="card kvl" href="KVLTV/index.html">
                <div class="card-content">
                    <img src="logo.png" alt="Logo KVL">
                    <div>
                        <h2>KVL TV</h2>
                        <p>Painel para TV</p>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

    <!-- Seção Blessed -->
    <div class="section">
        <div class="section-title">
            <span class="bar bar-blessed"></span>
            Blessed
        </div>
        <div class="grid">
            <a class="card blessed" href="BLESSEDOP/index.html">
                <div class="card-content">
                    <img src="logoB2.png" alt="Logo Blessed">
                    <div>
                        <h2>Blessed OP</h2>
                        <p>Painel operacional Blessed</p>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
            <a class="card blessed" href="BLESSEDTV/index.html">
                <div class="card-content">
                    <img src="logoB2.png" alt="Logo Blessed">
                    <div>
                        <h2>Blessed TV</h2>
                        <p>Painel TV Blessed</p>
                    </div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>
</body>
</html>
